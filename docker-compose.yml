# AgentMesh — platform assembled from open-source products.
#
# This file owns the components we configure directly. Three products publish
# their own compose files and are brought up alongside rather than hand-copied
# here, because duplicating a vendor's internals invites drift:
#
#   agentregistry  → see scripts/up-vendor-stacks.sh  (UI :12121)
#   Agent Control  → see scripts/up-vendor-stacks.sh  (server :8000, UI :4001)
#   Langfuse       → see scripts/up-vendor-stacks.sh  (UI :3000)
#
# Everything here runs credential-free: the default LLM backend is a local
# Ollama. Cloud providers are additive — put keys in .env and they appear in
# agentgateway/config.yaml.

name: agentmesh

services:

  # ─────────────────────────────────────────────────────────────────────
  # Data path — every LLM, MCP and tool call goes through here
  # ─────────────────────────────────────────────────────────────────────
  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.5.0
    container_name: agentmesh_gateway
    command: ["-f", "/config.yaml"]
    volumes:
      - ./agentgateway/config.yaml:/config.yaml:ro
      # Public half of the dev signing key. Create it once with:
      #   python3 scripts/agent_token.py init
      - ./auth/jwks.json:/auth/jwks.json:ro
    environment:
      # Where Ollama actually runs — another machine, this Docker host, or the
      # optional in-compose service below. Full URL with scheme and /v1.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      # Provider credentials. Absent ones simply leave that backend unusable;
      # the Ollama backend needs none of them.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AZURE_API_KEY=${AZURE_API_KEY:-}
      - AZURE_FOUNDRY_RESOURCE=${AZURE_FOUNDRY_RESOURCE:-}
      - AZURE_FOUNDRY_PROJECT=${AZURE_FOUNDRY_PROJECT:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
    ports:
      - "${GATEWAY_PORT:-4000}:4000"        # gateway + LLM playground
      - "${GATEWAY_ADMIN_PORT:-15000}:15000"  # admin UI
    depends_on:
      # Not ollama: it may be on another machine, and is opt-in here.
      - cedar-shim
      - presidio-adapter
    extra_hosts:
      # Lets OLLAMA_BASE_URL reach a server on the Docker host itself.
      - "host.docker.internal:host-gateway"
    networks: [agentmesh]

  # ─────────────────────────────────────────────────────────────────────
  # Identity & policy — real Cedar, in a real PDP
  # ─────────────────────────────────────────────────────────────────────
  cedar-agent:
    image: permitio/cedar-agent:latest
    container_name: agentmesh_cedar_agent
    # Bind to all interfaces; the image defaults to 127.0.0.1, which would be
    # unreachable from other containers.
    command: ["--addr", "0.0.0.0:8180"]
    ports:
      - "${CEDAR_AGENT_PORT:-8180}:8180"
    networks: [agentmesh]

  # Translates agentgateway's extAuthz (any 2xx = allow) into a Cedar decision.
  cedar-shim:
    build:
      # Root context so the image can pick up certs/ — see certs/README.md.
      context: .
      dockerfile: cedar-shim/Dockerfile
    container_name: agentmesh_cedar_shim
    environment:
      - CEDAR_AGENT_URL=http://cedar-agent:8180
      - LISTEN_PORT=9000
      # 1 logs the headers agentgateway forwards here — the fastest way to see
      # why an identity is or is not arriving. May include Authorization.
      - SHIM_DEBUG_HEADERS=${SHIM_DEBUG_HEADERS:-0}
    # Deliberately NOT published. Only agentgateway calls it, over the compose
    # network — and it is the component that decides authorization, so exposing
    # it on the host is both an unnecessary clash (9000 is a popular port) and
    # an unnecessary attack surface. To debug it:
    #   docker compose exec agentgateway wget -qO- http://cedar-shim:9000/healthz
    expose:
      - "9000"
    depends_on:
      - cedar-agent
    networks: [agentmesh]

  # Loads cedar/ schema, policies and entities into cedar-agent on startup,
  # then exits. Re-run with `docker compose up cedar-loader` after edits.
  cedar-loader:
    # Stock python image, stdlib only — the loader builds JSON with json.dumps
    # rather than shell escaping. See the header of scripts/load_cedar.py for
    # why that distinction cost a debugging session.
    image: python:3.12-slim
    container_name: agentmesh_cedar_loader
    volumes:
      - ./cedar:/cedar:ro
      - ./scripts/load_cedar.py:/load_cedar.py:ro
    entrypoint: ["python", "-u", "/load_cedar.py"]
    environment:
      - CEDAR_AGENT_URL=http://cedar-agent:8180
    depends_on:
      - cedar-agent
    restart: on-failure
    networks: [agentmesh]

  # ─────────────────────────────────────────────────────────────────────
  # PII — detection (Presidio) behind agentgateway's guardrail webhook
  # ─────────────────────────────────────────────────────────────────────
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: agentmesh_presidio_analyzer
    environment:
      - RECOGNIZER_REGISTRY_CONF_FILE=/app/conf/recognizers.yaml
    volumes:
      - ./presidio/conf/recognizers.yaml:/app/conf/recognizers.yaml:ro
    ports:
      - "${PRESIDIO_ANALYZER_PORT:-5001}:3000"
    networks: [agentmesh]

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    container_name: agentmesh_presidio_anonymizer
    ports:
      - "${PRESIDIO_ANONYMIZER_PORT:-5002}:3000"
    networks: [agentmesh]

  presidio-adapter:
    build:
      context: .
      dockerfile: presidio-adapter/Dockerfile
    container_name: agentmesh_presidio_adapter
    environment:
      - PRESIDIO_ANALYZER_URL=http://presidio-analyzer:3000
      - PRESIDIO_ANONYMIZER_URL=http://presidio-anonymizer:3000
      - LISTEN_PORT=8080
      # reject | mask — see presidio-adapter/README.md. Defaults to reject,
      # which is what "PII never leaves" actually requires.
      - GUARDRAIL_ACTION=${GUARDRAIL_ACTION:-reject}
      - PRESIDIO_SCORE_THRESHOLD=${PRESIDIO_SCORE_THRESHOLD:-0.5}
      # Which Presidio entities cause a rejection.
      #
      # Empty would mean "all", and all is unusable: spaCy tags "France" in
      # "What is the capital of France?" as LOCATION. Excluded for that reason:
      # LOCATION, DATE_TIME, NRP, URL.
      #
      # PERSON is excluded too, and that one is a real trade. Name-level NER
      # cannot survive a multi-turn agent — spaCy read "MoE" (mixture of
      # experts) as a person and killed a CrewAI run on its second task, because
      # each task's output becomes the next task's prompt. Ideally strictness
      # would follow the destination, but the guardrail webhook receives only
      # `{"body": {"messages": [...]}}` and cannot tell where a call is going;
      # see the header of presidio-adapter/main.py. What keeps an agent's
      # traffic on-premises is Cedar's allowed_model_tiers, not this list.
      #
      # Everything below is a hard identifier that regex or pattern matching
      # gets right, so false positives are rare and blocking is safe.
      - PRESIDIO_ENTITIES=${PRESIDIO_ENTITIES:-EMAIL_ADDRESS,PHONE_NUMBER,US_SSN,US_ITIN,US_PASSPORT,US_DRIVER_LICENSE,US_BANK_NUMBER,CREDIT_CARD,IBAN_CODE,CRYPTO,MEDICAL_LICENSE,UK_NHS,IP_ADDRESS,INTERNAL_EMPLOYEE_ID}
      # 1 logs the matched span, so you can see what a framework actually sent
      # when its prompt is blocked. Writes detected values to the log.
      - ADAPTER_DEBUG_MATCHES=${ADAPTER_DEBUG_MATCHES:-0}
    # Not published, for the same reason as cedar-shim: only the gateway calls
    # it, and 8080 clashes with almost everything.
    expose:
      - "8080"
    depends_on:
      - presidio-analyzer
      - presidio-anonymizer
    networks: [agentmesh]

  # ─────────────────────────────────────────────────────────────────────
  # Optional in-compose Ollama, for when you don't already have one.
  #
  #   docker compose --profile local-llm up -d
  #   OLLAMA_BASE_URL=http://ollama:11434/v1   (in .env)
  #
  # Omitted from the default `up` because Ollama usually already runs
  # elsewhere — point OLLAMA_BASE_URL at it instead.
  # ─────────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: agentmesh_ollama
    profiles: [local-llm]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    networks: [agentmesh]

  # ─────────────────────────────────────────────────────────────────────
  # Durable orchestration
  # ─────────────────────────────────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: agentmesh_temporal
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    depends_on:
      temporal-postgres:
        condition: service_healthy
    networks: [agentmesh]

  temporal-ui:
    image: temporalio/ui:latest
    container_name: agentmesh_temporal_ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8233
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8080"
    depends_on:
      - temporal
    networks: [agentmesh]

  temporal-postgres:
    image: postgres:16-alpine
    container_name: agentmesh_temporal_postgres
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_DB=temporal
    volumes:
      - temporal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [agentmesh]

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: agentmesh_orchestrator
    environment:
      # Without this, print() from the worker is buffered and `docker compose
      # logs` shows nothing at all — including the connection banner.
      - PYTHONUNBUFFERED=1
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - GATEWAY_URL=http://agentgateway:4000
      # Must be a JWT — see .env.example. No default: a placeholder string
      # would fail authn at the first call, far from the cause.
      - GATEWAY_TOKEN=${GATEWAY_TOKEN:?run scripts/agent_token.py issue orchestrator and set GATEWAY_TOKEN in .env}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - temporal
      - agentgateway
    networks: [agentmesh]

  # Agent plane: outbound-only, no published ports.
  remote-runner:
    build:
      context: .
      dockerfile: remote_runner/Dockerfile
    container_name: agentmesh_remote_runner
    environment:
      # Without this, print() from the worker is buffered and `docker compose
      # logs` shows nothing at all — including the connection banner.
      - PYTHONUNBUFFERED=1
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - GATEWAY_URL=http://agentgateway:4000
      # Must be a JWT — see .env.example. No default: a placeholder string
      # would fail authn at the first call, far from the cause.
      - GATEWAY_TOKEN=${GATEWAY_TOKEN:?run scripts/agent_token.py issue orchestrator and set GATEWAY_TOKEN in .env}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - temporal
      - agentgateway
    networks: [agentmesh]

  # ─────────────────────────────────────────────────────────────────────
  # Telemetry — strips prompt bodies, forwards to Langfuse over OTLP/HTTP
  # ─────────────────────────────────────────────────────────────────────
  otel-collector:
    # 0.100.0 could not expand ${env:VAR:-default} and refused to start when
    # LANGFUSE_BASIC_AUTH was unset. Telemetry being unconfigured must not take
    # the collector down.
    image: otel/opentelemetry-collector-contrib:0.119.0
    container_name: agentmesh_otel_collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      # Langfuse accepts OTLP over HTTP only (no gRPC). Basic auth is
      # base64("public_key:secret_key") from a Langfuse project.
      - LANGFUSE_OTLP_ENDPOINT=${LANGFUSE_OTLP_ENDPOINT:-http://host.docker.internal:3000/api/public/otel}
      - LANGFUSE_BASIC_AUTH=${LANGFUSE_BASIC_AUTH:-}
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [agentmesh]

volumes:
  temporal-pgdata:
  ollama-models:

networks:
  agentmesh:
    driver: bridge
