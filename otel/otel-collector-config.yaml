receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 128

  transform:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # Zero Data Retention: Redact raw message bodies
          - delete_key(attributes, "gen_ai.prompt")
          - delete_key(attributes, "gen_ai.completion")
          - delete_key(attributes, "llm.prompts")
          - delete_key(attributes, "llm.completions")
          - delete_key(attributes, "input.value")
          - delete_key(attributes, "output.value")
          # agentgateway's token-usage and cost attributes are NOT touched, so
          # per-session accounting survives redaction — you keep the numbers
          # without keeping the prompts.
          - set(attributes["privacy.sanitized"], "true")
          - set(attributes["platform.version"], "v2.0.0")

exporters:
  # Langfuse accepts OTLP over HTTP ONLY — it has no gRPC endpoint, so an
  # `otlp/` (gRPC) exporter here would silently drop every trace.
  # LANGFUSE_BASIC_AUTH is base64("public_key:secret_key") from a Langfuse
  # project; without it Langfuse rejects the batch.
  otlphttp/langfuse:
    endpoint: "${env:LANGFUSE_OTLP_ENDPOINT}"
    headers:
      Authorization: "Basic ${env:LANGFUSE_BASIC_AUTH}"

  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, transform]
      # `debug` sits alongside Langfuse so traces stay visible in
      # `docker compose logs otel-collector` before a Langfuse project exists.
      # AgentOps is the alternative sink: add an `otlp/agentops` exporter and
      # swap it in here — the collector is the seam, so no agent changes.
      exporters: [otlphttp/langfuse, debug]
