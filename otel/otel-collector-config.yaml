receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 128

  # ── Zero Data Retention, as an ALLOW-LIST ───────────────────────────────────
  # This used to be a deny-list of six attribute names — gen_ai.prompt,
  # gen_ai.completion, llm.prompts, llm.completions, input.value, output.value.
  # agentgateway emits none of them. Its attributes are gen_ai.usage.*, http.*,
  # agentgateway.user, src.addr. So the scrub deleted nothing and protected
  # nothing, while the documentation said otherwise.
  #
  # `keep_keys` inverts the default. Anything not named below is dropped:
  # a prompt body under any key, an attribute a future gateway version adds, a
  # provider-specific field nobody reviewed. Forgetting to add something costs
  # a missing chart; forgetting to deny something costs a leak.
  #
  # Adding a key here is a privacy decision. Check what it can contain first.
  transform:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - >-
            keep_keys(attributes, [
              "gen_ai.usage.input_tokens",
              "gen_ai.usage.output_tokens",
              "gen_ai.usage.cache_read.input_tokens",
              "gen_ai.request.model",
              "gen_ai.response.model",
              "gen_ai.provider.name",
              "gen_ai.operation.name",
              "agentgateway.user",
              "http.status",
              "http.method",
              "duration"
            ])
          # Deliberately NOT kept, and why:
          #   src.addr        the calling client's IP — personal data under GDPR.
          #                   The gateway also strips it at source; see
          #                   config.tracing.fields.remove. It stays in the local
          #                   request-log database for debugging.
          #   http.path       can carry identifiers in a path segment.
          #   http.host       reveals deployment topology, no analytical value.
          #   user_agent.name fingerprinting surface.
          #   jwt.sub         duplicates agentgateway.user.
          #   route, endpoint internal topology, including backend addresses.
          - set(attributes["privacy.sanitized"], "true")
      # Resource attributes travel with every span and were never scrubbed at
      # all — the old config had no `context: resource` block. An SDK puts host
      # names, process command lines and container ids here by default.
      - context: resource
        statements:
          - >-
            keep_keys(attributes, [
              "service.name",
              "service.version"
            ])

exporters:
  # Langfuse accepts OTLP over HTTP ONLY — it has no gRPC endpoint, so an
  # `otlp/` (gRPC) exporter here would silently drop every trace.
  # LANGFUSE_BASIC_AUTH is base64("public_key:secret_key") from a Langfuse
  # project; without it Langfuse rejects the batch.
  #
  # The `:-` defaults are load-bearing. An unset variable is nil, not "", and
  # the collector refuses to start on it:
  #   failed to resolve config: expanding ${env:LANGFUSE_BASIC_AUTH},
  #   expected convertable to string value type, got %!q(<nil>)
  # Telemetry being unconfigured must not stop the collector — the debug
  # exporter below is what you read until a Langfuse project exists.
  otlphttp/langfuse:
    endpoint: "${env:LANGFUSE_OTLP_ENDPOINT:-http://langfuse-web:3000/api/public/otel}"
    headers:
      Authorization: "Basic ${env:LANGFUSE_BASIC_AUTH:-}"

  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, transform]
      # `debug` sits alongside Langfuse so traces stay visible in
      # `docker compose logs otel-collector` before a Langfuse project exists.
      # AgentOps is the alternative sink: add an `otlp/agentops` exporter and
      # swap it in here — the collector is the seam, so no agent changes.
      exporters: [otlphttp/langfuse, debug]
