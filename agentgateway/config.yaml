# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# agentgateway — the single data path for every LLM, MCP and tool call.
#
# Clients always speak one OpenAI-compatible API to :4000. Which backend serves
# a request is decided here by model name, so adding or swapping a provider
# never touches agent code.
#
# ─────────────────────────────────────────────────────────────────────────────
# VERIFICATION — every shape below was validated against agentgateway v1.5.0:
#
#   docker run --rm -v ./agentgateway:/c:ro cr.agentgateway.dev/agentgateway:v1.5.0 \
#     -f /c/config.yaml --validate-only
#
# Use that command after any edit. Its errors name the exact field and list the
# accepted alternatives, which is how the enums documented below were found.
# ─────────────────────────────────────────────────────────────────────────────

llm:
  # Policies shared by every backend below. Declaring them once is what stops a
  # newly added provider from quietly bypassing the controls.
  policies:

    guardrails:
      # Apply the checks to streamed responses too. Without this, `stream: true`
      # is an unguarded path straight out of the platform.
      # Accepted values: Enabled | Disabled (capitalised).
      streaming: Enabled

      request:
        # ── Layer 1: mask well-formed PII inline ──────────────────────────────
        # `action` accepts exactly: mask | reject | audit.
        # Each rule is either {builtin: <name>} or {pattern: <regex>}. There is
        # no `name` field — a rule carrying one is rejected outright.
        # The builtin set is exactly: ssn, creditCard, email, phoneNumber.
        - regex:
            action: mask
            rules:
              - builtin: ssn
              - builtin: creditCard
              - builtin: email
              - builtin: phoneNumber
              # Org-specific identifier; mirrors the Presidio recognizer of the
              # same shape in presidio/conf/recognizers.yaml.
              - pattern: 'EMP-[0-9]{6}'

        # ── Layer 2: Presidio NER catches what regex cannot ───────────────────
        # `action` here accepts ONLY reject | audit — there is no mask. The
        # vendor's Guardrail Webhook API page describes Pass/Mask/Reject; this
        # build does not implement Mask, so a webhook cannot redact. Masking is
        # the regex layer's job and rejection is this one's, which is why the
        # adapter defaults to GUARDRAIL_ACTION=reject.
        #
        # failureMode accepts failClosed | failOpen. failClosed is the whole
        # point: if Presidio is unreachable, the request must not proceed
        # unscreened.
        - webhook:
            target:
              host: presidio-adapter:8080
            action: reject
            failureMode: failClosed

      response:
        # The completion is screened on the way back too — a model can echo or
        # infer PII that was never in the prompt. Identifiers are still masked.
        - regex:
            action: mask
            rules:
              - builtin: ssn
              - builtin: creditCard
              - builtin: phoneNumber
        # `audit`, not `reject`: this direction is inbound. The requirement is
        # that PII is not *sent* anywhere, and a model naming a public figure
        # back to us is not egress. Rejecting here also made multi-turn agents
        # unusable — "Name the CEO of OpenAI" returned 403 PERSON.
        - webhook:
            target:
              host: presidio-adapter:8080
            action: audit
            failureMode: failClosed

    # ── Authentication: who is calling ──────────────────────────────────────
    # The token's `sub` is the agent identity, and the ONLY source of it.
    # Issue one with:  python3 scripts/agent_token.py issue <agent-id>
    #
    # mode accepts strict | optional | permissive — strict rejects a request
    # with no valid token, which is what makes an unregistered agent inert.
    # location accepts header | queryParameter | cookie | expression.
    #
    # jwks accepts file | inline | remote. In production this points at your
    # IdP; nothing else in this file changes.
    jwtAuth:
      issuer: agentmesh-dev
      audiences: ["agentmesh-gateway"]
      jwks:
        file: /auth/jwks.json
      mode: strict

    # ── Cedar IAM, delegated ────────────────────────────────────────────────
    # HTTP protocol chosen deliberately: any 2xx means allow, which is exactly
    # what cedar-shim translates a Cedar decision into.
    #
    # agentgateway forwards only `authorization` and `host` to an HTTP extAuthz
    # endpoint — the client's own headers are NOT passed through. That is the
    # property the security model rests on: an agent can set
    # `x-agentmesh-agent: someone-else` and it never reaches the shim.
    #
    # addRequestHeaders values are CEL expressions (bare, not brace-wrapped), so
    # the identity the shim authorizes comes from the validated token and
    # nowhere else. `body` forwards the request body, without which the shim
    # cannot see which model is being asked for and can only authorize by path.
    extAuthz:
      host: cedar-shim:9000
      protocol:
        http:
          body: request.body
          addRequestHeaders:
            x-agentmesh-agent: jwt.sub

  models:

    # ── OpenAI
    #
    #    Behind a TLS-inspecting corporate proxy the upstream call fails with
    #      upstream call failed: Connect: invalid peer certificate: UnknownIssuer
    #    because the gateway trusts public roots, not your proxy's. Point the
    #    entry at the CA instead of disabling verification — mount certs/ into
    #    the container and add:
    #      backendTLS:
    #        root: /certs/zscaler-root.crt
    #    (`insecure: true` also exists. It turns off verification for that
    #    backend entirely, which is not the same thing and should not be used to
    #    paper over a missing CA.)
    - name: "gpt-*"
      provider: openAI
      params:
        apiKey: "$OPENAI_API_KEY"

    # ── Anthropic direct. Prefixed rather than suffixed: a wildcard may sit
    #    only at the start or the end of a name, so "claude-*-direct" is
    #    rejected outright ("model name wildcard must be either at the
    #    beginning or the end").
    - name: "anthropic/*"
      provider: anthropic
      params:
        apiKey: "$ANTHROPIC_API_KEY"

    # ── Anthropic on Azure AI Foundry
    #    agentgateway routes claude-* to /anthropic/v1/messages and injects the
    #    version headers itself — nothing to implement here.
    - name: "claude-*"
      provider: azure
      auth:
        key:
          value: "$AZURE_API_KEY"
          location:
            header:
              name: api-key
      params:
        azureResourceName: "$AZURE_FOUNDRY_RESOURCE"
        azureResourceType: foundry
        azureProjectName: "$AZURE_FOUNDRY_PROJECT"

    # ── Google Gemini
    - name: "gemini-*"
      provider: gemini
      params:
        apiKey: "$GEMINI_API_KEY"

    # ── Groq
    - name: "groq/*"
      provider: groq
      params:
        apiKey: "$GROQ_API_KEY"

    # ── Self-hosted Ollama, LAST so it acts as the catch-all. No credential
    #    required — the platform runs with no cloud account at all, and an
    #    agent can be pinned to this backend by Cedar policy (see `pii-handler`
    #    in cedar/entities.json).
    #
    #    Every cloud entry above is prefix-scoped, so anything they do not claim
    #    is served locally. That is what lets you `ollama pull` an arbitrary tag
    #    — gemma4:latest, qwen3:8b — and use it without editing this file.
    #
    #    baseUrl is a FULL URL including scheme and the /v1 suffix, not a
    #    host:port pair. Set OLLAMA_BASE_URL in .env to wherever the server
    #    actually runs. agentgateway defaults to http://localhost:11434/v1,
    #    which inside a container means the container itself — so this is
    #    effectively required.
    #
    #    ── Where PII screening is decided ────────────────────────────────────
    #    Not here. agentgateway supports a per-model `guardrails:` block, and it
    #    looked like the right place to relax screening for an on-premises
    #    backend — but it does not cover every message role. A per-model
    #    `action: audit` applies to the user turn while `system` and `assistant`
    #    turns still fall through to llm.policies.guardrails above, so a
    #    multi-turn conversation is ungovernable from there. Verified against
    #    v1.5.0: PII in a `user` message audited, the same text in an
    #    `assistant` message rejected.
    #
    #    presidio-adapter therefore makes the decision, using the `model` field
    #    it already receives — see HOSTED_MODEL_PREFIXES in
    #    presidio-adapter/main.py.
    - name: "*"
      provider: ollama
      params:
        baseUrl: "$OLLAMA_BASE_URL"

    # More providers are a copy of the pattern above: bedrock (auth.aws),
    # vertex (auth.gcp), mistral, deepseek, together, fireworks, openrouter,
    # cohere, xai, huggingface, baseten, cerebras, deepinfra, vLLM, LM Studio,
    # or any OpenAI-compatible endpoint via a custom provider. Guardrails and
    # extAuthz above apply to every one of them automatically.
    #
    # Per-model overrides available if a backend needs to differ: guardrails,
    # authorization, defaults, overrides, transformation, requestHeaders,
    # responseHeaders, backendTLS, auth, health, promptCaching, matches.

# ─────────────────────────────────────────────────────────────────────────────
# MCP — tools reachable through the same authz and guardrail pipeline.
# Servers listed here should mirror what is approved in agentregistry; nothing
# else is routable.
# ─────────────────────────────────────────────────────────────────────────────
mcp:
  targets: []
    # - name: filesystem
    #   stdio:
    #     cmd: npx
    #     args: ["-y", "@modelcontextprotocol/server-filesystem", "/workspace"]

# There is no `ui:` toggle in v1.5.0 — the block exists but accepts only
# `gateways` and `policies`, so `ui: {enabled: true}` is a hard parse error.
# The admin UI and playground are served without configuration.
